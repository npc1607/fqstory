      <path d="M 200 404 L 200 372 L 200 372 L 200 340" fill="none" stroke="#334155" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
      <rect x="150.5" y="361" width="99" height="22" rx="5" fill="#e2e8f0" stroke="#dee2e6"/>
